<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MercadoLibre Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e4e7;
    --muted: #9ca3af;
    --accent: #fbbf24;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --purple: #a855f7;
    --orange: #f97316;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .header h1 { font-size: 1.5rem; font-weight: 700; }
  .header h1 span { color: var(--accent); }
  .header .subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
  .header-actions { display: flex; gap: 0.5rem; }
  .btn {
    border: none;
    padding: 0.5rem 1.2rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-accent { background: var(--accent); color: #000; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-blue { background: var(--blue); color: #fff; }
  .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.78rem; }
  .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }

  /* KPI Cards */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }
  .kpi-card .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .kpi-card .value { font-size: 1.75rem; font-weight: 700; margin: 0.25rem 0; }
  .kpi-card .sub { color: var(--muted); font-size: 0.8rem; }
  .kpi-card.green .value { color: var(--green); }
  .kpi-card.blue .value { color: var(--blue); }
  .kpi-card.accent .value { color: var(--accent); }
  .kpi-card.purple .value { color: var(--purple); }
  .kpi-card.orange .value { color: var(--orange); }
  .kpi-card.red .value { color: var(--red); }

  /* Charts */
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }
  .chart-card h3 { font-size: 0.95rem; margin-bottom: 1rem; color: var(--muted); }
  .chart-card canvas { max-height: 300px; }

  /* Tables */
  .table-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    overflow-x: auto;
  }
  .table-card h3 { font-size: 0.95rem; margin-bottom: 1rem; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 2px solid var(--border); color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; }
  td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); }
  tr:hover td { background: rgba(255,255,255,0.03); }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
  }
  .badge-meli { background: #fef3c7; color: #92400e; }
  .badge-fisico { background: #dbeafe; color: #1e40af; }
  .badge-ok { background: #dcfce7; color: #166534; }
  .badge-transit { background: #fef9c3; color: #854d0e; }
  .text-right { text-align: right; }
  .text-green { color: var(--green); }
  .text-red { color: var(--red); }

  /* Resumen table */
  .resumen-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .loading { text-align: center; padding: 4rem; color: var(--muted); }
  .loading .spinner { display: inline-block; width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    width: 95%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
  }
  .modal h2 { font-size: 1.2rem; margin-bottom: 1.25rem; }
  .modal h2 span { color: var(--accent); }
  .modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text); }
  .form-group { margin-bottom: 1rem; }
  .form-group label {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .form-group input, .form-group select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--accent);
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  .form-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.5rem;
    justify-content: flex-end;
  }
  .btn-cancel {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-cancel:hover { border-color: var(--text); color: var(--text); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    padding: 0.75rem 1.25rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    z-index: 2000;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s ease;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--green); color: #fff; }
  .toast.error { background: var(--red); color: #fff; }

  /* Formula status */
  .formula-status {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    padding: 0.3rem 0.7rem;
    border-radius: 6px;
    background: rgba(34,197,94,0.1);
    color: var(--green);
    border: 1px solid rgba(34,197,94,0.2);
  }
  .formula-status.warn { background: rgba(239,68,68,0.1); color: var(--red); border-color: rgba(239,68,68,0.2); }

  @media (max-width: 900px) {
    .charts-grid, .resumen-grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📦 <span>MercadoLibre</span> Dashboard</h1>
    <div class="subtitle">Gestión de Compras, Ventas e Inventario</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-green" onclick="openModal('venta')">➕ Agregar Venta</button>
    <button class="btn btn-blue" onclick="openModal('compra')">➕ Agregar Compra</button>
    <button class="btn" style="background:#a855f7;color:#fff" onclick="openModal('producto')">🆕 Nuevo Producto</button>
    <button class="btn btn-accent" onclick="loadData()">🔄 Actualizar</button>
  </div>
</div>

<div class="container" id="app">
  <div class="loading"><div class="spinner"></div><p style="margin-top:1rem">Cargando datos...</p></div>
</div>

<!-- Modal Venta -->
<div class="modal-overlay" id="modal-venta">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('venta')">&times;</button>
    <h2>🛒 <span>Agregar Venta</span></h2>
    <form id="form-venta" onsubmit="submitVenta(event)">
      <div class="form-row">
        <div class="form-group">
          <label>Quien Recibe</label>
          <select name="quienRecibe" required>
            <option value="">Seleccionar...</option>
            <option value="Bayron">Bayron</option>
            <option value="Daniela">Daniela</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" name="fecha" required>
        </div>
      </div>
      <div class="form-group">
        <label>Producto (Inventario)</label>
        <select name="productoInventario" id="venta-producto-select" onchange="onProductoSelect(this)">
          <option value="">-- Seleccionar del inventario --</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Código</label>
          <input type="text" name="codigo" id="venta-codigo" placeholder="Ej: 052336341456">
        </div>
        <div class="form-group">
          <label>Documento</label>
          <input type="text" name="documento" placeholder="Nro documento">
        </div>
      </div>
      <div class="form-group">
        <label>Cliente</label>
        <input type="text" name="cliente" placeholder="Nombre del cliente (opcional)">
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <input type="text" name="descripcion" id="venta-descripcion" placeholder="Nombre del producto" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Cantidad</label>
          <input type="number" name="cantidad" min="1" value="1" required>
        </div>
        <div class="form-group">
          <label>Costo Unitario (auto)</label>
          <input type="text" name="costo" id="venta-costo" placeholder="Se calcula automáticamente" readonly style="background:#1a1c2a;color:#9ca3af;cursor:not-allowed;">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Precio Venta</label>
          <input type="text" name="precioVenta" placeholder="$25.000" required>
        </div>
        <div class="form-group">
          <label>Fuente</label>
          <select name="fuente" required>
            <option value="MELI">MercadoLibre</option>
            <option value="FISICO">Físico</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Envío</label>
          <input type="number" name="envio" placeholder="0" value="0" min="0">
        </div>
        <div class="form-group">
          <label>Comisión</label>
          <input type="number" name="comision" placeholder="0" value="0" min="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Otros</label>
          <input type="number" name="otros" placeholder="0" value="0" min="0">
        </div>
        <div class="form-group">
          <label>En Tránsito</label>
          <select name="enTransito">
            <option value="NO">No</option>
            <option value="SI">Sí</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" onclick="closeModal('venta')">Cancelar</button>
        <button type="submit" class="btn btn-green">💾 Guardar Venta</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Compra -->
<div class="modal-overlay" id="modal-compra">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('compra')">&times;</button>
    <h2>📥 <span>Agregar Compra</span></h2>
    <form id="form-compra" onsubmit="submitCompra(event)">
      <div class="form-row">
        <div class="form-group">
          <label>Quién Entrega</label>
          <select name="quienEntrega" required>
            <option value="">Seleccionar...</option>
            <option value="Bayron">Bayron</option>
            <option value="Daniela">Daniela</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" name="fecha" required>
        </div>
      </div>
      <div class="form-group">
        <label>Producto</label>
        <select name="productoCompra" id="compra-producto-select" onchange="onCompraProductoSelect(this)" required>
          <option value="">-- Seleccionar producto --</option>
          <option value="__nuevo__">🆕 Producto nuevo</option>
        </select>
      </div>
      <div id="compra-nuevo-fields" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label>Código nuevo</label>
            <input type="text" name="codigoNuevo" placeholder="Ej: 3701129800843">
          </div>
          <div class="form-group">
            <label>Descripción nueva</label>
            <input type="text" name="descripcionNueva" placeholder="Nombre del producto">
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Código</label>
          <input type="text" name="codigo" id="compra-codigo" placeholder="Ej: 052336341456" readonly style="opacity:0.6">
        </div>
        <div class="form-group">
          <label>Cantidad</label>
          <input type="number" name="cantidad" min="1" value="1" required>
        </div>
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <input type="text" name="descripcion" id="compra-descripcion" placeholder="Nombre del producto" readonly style="opacity:0.6">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Valor Unitario</label>
          <input type="text" name="valor" placeholder="$9.600" required>
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select name="estado">
            <option value="OK">OK</option>
            <option value="Transit">En Tránsito</option>
            <option value="Pendiente">Pendiente</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" onclick="closeModal('compra')">Cancelar</button>
        <button type="submit" class="btn btn-blue">💾 Guardar Compra</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Producto -->
<div class="modal-overlay" id="modal-producto">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('producto')">&times;</button>
    <h2>🆕 <span>Nuevo Producto</span></h2>
    <form id="form-producto" onsubmit="submitProducto(event)">
      <div class="form-group">
        <label>Código</label>
        <input type="text" name="codigo" placeholder="Ej: 3701129800843" required>
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <input type="text" name="descripcion" placeholder="Nombre del producto" required>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" onclick="closeModal('producto')">Cancelar</button>
        <button type="submit" class="btn" style="background:#a855f7;color:#fff">💾 Crear Producto</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const $ = (sel) => document.querySelector(sel);
const fmt = (n) => '$' + Number(n).toLocaleString('es-CO');
let charts = {};

function destroyCharts() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

// ── Inventory data cache ──
let inventarioCache = [];

function loadInventarioSelect() {
  fetch('/api/inventario')
    .then(r => r.json())
    .then(items => {
      inventarioCache = items;
      const sel = $('#venta-producto-select');
      // Keep first option (placeholder)
      while (sel.options.length > 1) sel.remove(1);
      items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.codigo;
        const stock = item.stock || '0';
        opt.textContent = `${item.descripcion} (Stock: ${stock})`;
        opt.dataset.descripcion = item.descripcion;
        opt.dataset.costo = item.costo;
        opt.dataset.codigo = item.codigo;
        sel.appendChild(opt);
      });
    })
    .catch(err => console.warn('No se pudo cargar inventario:', err));
}

function onProductoSelect(sel) {
  const opt = sel.options[sel.selectedIndex];
  if (!opt || !opt.value) return;
  const codigo = opt.dataset.codigo || '';
  const descripcion = opt.dataset.descripcion || '';
  const costo = opt.dataset.costo || '';
  const codigoInput = $('#venta-codigo');
  const descInput = $('#venta-descripcion');
  const costoInput = $('#venta-costo');
  if (codigoInput) codigoInput.value = codigo;
  if (descInput) descInput.value = descripcion;
  if (costoInput) costoInput.value = costo;
}

// ── Compra product select ──
function loadCompraSelect() {
  fetch('/api/inventario-todos')
    .then(r => r.json())
    .then(items => {
      const sel = $('#compra-producto-select');
      while (sel.options.length > 2) sel.remove(2);
      items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.codigo;
        const stock = item.stock || '0';
        opt.textContent = `${item.descripcion} (Stock: ${stock})`;
        opt.dataset.descripcion = item.descripcion;
        opt.dataset.codigo = item.codigo;
        sel.appendChild(opt);
      });
    })
    .catch(err => console.warn('No se pudo cargar inventario-todos:', err));
}

function onCompraProductoSelect(sel) {
  const val = sel.value;
  const nuevoFields = $('#compra-nuevo-fields');
  const codigoInput = $('#compra-codigo');
  const descInput = $('#compra-descripcion');

  if (val === '__nuevo__') {
    nuevoFields.style.display = 'block';
    codigoInput.value = '';
    codigoInput.readOnly = false;
    codigoInput.style.opacity = '1';
    descInput.value = '';
    descInput.readOnly = false;
    descInput.style.opacity = '1';
  } else {
    nuevoFields.style.display = 'none';
    const opt = sel.options[sel.selectedIndex];
    if (opt && opt.value) {
      codigoInput.value = opt.dataset.codigo || '';
      descInput.value = opt.dataset.descripcion || '';
    } else {
      codigoInput.value = '';
      descInput.value = '';
    }
    codigoInput.readOnly = true;
    codigoInput.style.opacity = '0.6';
    descInput.readOnly = true;
    descInput.style.opacity = '0.6';
  }
}

// ── Toast ──
function showToast(msg, type = 'success') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ── Modal ──
function openModal(type) {
  $(`#modal-${type}`).classList.add('active');
  // Set today's date as default (Colombia timezone)
  const dateInput = $(`#form-${type} input[name="fecha"]`);
  if (dateInput && !dateInput.value) {
    dateInput.value = getTodayColombia();
  }
}
function closeModal(type) {
  $(`#modal-${type}`).classList.remove('active');
  $(`#form-${type}`).reset();
  // Reset compra select state
  if (type === 'compra') {
    const nuevoFields = $('#compra-nuevo-fields');
    if (nuevoFields) nuevoFields.style.display = 'none';
    const codigoInput = $('#compra-codigo');
    const descInput = $('#compra-descripcion');
    if (codigoInput) { codigoInput.value = ''; codigoInput.readOnly = true; codigoInput.style.opacity = '0.6'; }
    if (descInput) { descInput.value = ''; descInput.readOnly = true; descInput.style.opacity = '0.6'; }
  }
}
// Close on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', (e) => {
    if (e.target === el) el.classList.remove('active');
  });
});

// ── Format date for sheet (D/M/YYYY) — Colombia timezone ──
function formatDate(dateStr) {
  // dateStr comes as YYYY-MM-DD from <input type="date">
  // Reformat to D/M/YYYY for Google Sheets Spanish locale
  const [year, month, day] = dateStr.split('-');
  return `${parseInt(day)}/${parseInt(month)}/${year}`;
}

function getTodayColombia() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' });
}

// ── Submit Producto ──
async function submitProducto(e) {
  e.preventDefault();
  const f = e.target;
  const btn = f.querySelector('[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Creando...';

  try {
    const body = {
      codigo: f.codigo.value,
      descripcion: f.descripcion.value,
    };

    const res = await fetch('/api/productos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (data.success) {
      showToast(`✅ Producto creado en fila ${data.row}`);
      closeModal('producto');
      loadInventarioSelect();
      loadData();
    } else {
      throw new Error(data.error);
    }
  } catch (err) {
    showToast(`❌ Error: ${err.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Crear Producto';
  }
}

// ── Submit Venta ──
async function submitVenta(e) {
  e.preventDefault();
  const f = e.target;
  const btn = f.querySelector('[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    const body = {
      quienRecibe: f.quienRecibe.value,
      fecha: formatDate(f.fecha.value),
      codigo: f.codigo.value,
      documento: f.documento.value,
      cliente: f.cliente.value,
      descripcion: f.descripcion.value,
      cantidad: f.cantidad.value,
      precioVenta: f.precioVenta.value,
      envio: f.envio.value || '0',
      comision: f.comision.value || '0',
      otros: f.otros.value || '0',
      enTransito: f.enTransito.value,
      fuente: f.fuente.value,
    };

    const res = await fetch('/api/ventas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (data.success) {
      showToast(`✅ Venta registrada en fila ${data.row} con fórmulas`);
      closeModal('venta');
      loadData();
    } else {
      throw new Error(data.error);
    }
  } catch (err) {
    showToast(`❌ Error: ${err.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Guardar Venta';
  }
}

// ── Submit Compra ──
async function submitCompra(e) {
  e.preventDefault();
  const f = e.target;
  const btn = f.querySelector('[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    const selVal = f.productoCompra.value;
    let codigo = f.codigo.value;
    let descripcion = f.descripcion.value;

    // If "nuevo producto" selected, create product first
    if (selVal === '__nuevo__') {
      codigo = f.codigoNuevo.value;
      descripcion = f.descripcionNueva.value;
      if (!codigo || !descripcion) throw new Error('Completa código y descripción del producto nuevo');

      const prodRes = await fetch('/api/productos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codigo, descripcion }),
      });
      const prodData = await prodRes.json();
      if (!prodData.success) throw new Error(prodData.error);
      showToast(`🆕 Producto creado: ${descripcion}`);
    }

    const body = {
      quienEntrega: f.quienEntrega.value,
      fecha: formatDate(f.fecha.value),
      codigo,
      descripcion,
      cantidad: f.cantidad.value,
      valor: f.valor.value,
      estado: f.estado.value,
    };

    const res = await fetch('/api/compras', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (data.success) {
      showToast(`✅ Compra registrada en fila ${data.row} con fórmulas`);
      closeModal('compra');
      loadInventarioSelect();
      loadCompraSelect();
      loadData();
    } else {
      throw new Error(data.error);
    }
  } catch (err) {
    showToast(`❌ Error: ${err.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Guardar Compra';
  }
}

// ── Load Data ──
function loadData() {
  const app = $('#app');
  app.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:1rem">Cargando datos...</p></div>';

  fetch('/api/data')
    .then(r => r.json())
    .then(data => {
      destroyCharts();
      render(data);
    })
    .catch(err => {
      app.innerHTML = `<div class="loading"><p style="color:var(--red)">Error: ${err.message}</p></div>`;
    });
}

function parsePercent(val) {
  if (!val) return 0;
  return Number(String(val).replace(/[^0-9.,\-]/g, '').replace(',', '.')) || 0;
}

                <td><span class="badge badge-ok">${r['Cuadre'] || '-'}</span></td>
              </tr>
            `).join('')}

        </table>
      </div>
      <div class="table-card">
        <h3>⏳ Compras Pendientes / En Tránsito</h3>
        ${d.comprasPendientes.length === 0 ? '<p style="color:var(--muted);padding:1rem">Sin compras pendientes ✅</p>' : `
        <table>
          <thead><tr><th>Fecha</th><th>Descripción</th><th class="text-right">Total</th><th>Estado</th></tr></thead>
          <tbody>
            ${d.comprasPendientes.map(r => `
              <tr>
                <td>${r['Fecha'] || '-'}</td>
                <td>${r['Descripcion'] || '-'}</td>
                <td class="text-right">${r['Total'] || '-'}</td>
                <td><span class="badge badge-transit">${r['Estado']}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>`}
      </div>
    </div>

    <!-- Inventario -->
    <div class="table-card">
      <h3>📦 Inventario Actual</h3>
      <table>
        <thead><tr><th>Código</th><th>Descripción</th><th class="text-right">Entrada</th><th class="text-right">Salida</th><th class="text-right">Stock</th><th class="text-right">Costo Prom.</th><th class="text-right">Valor</th></tr></thead>
        <tbody>
          ${d.inventario.map(r => `

    <!-- Ventas Recientes -->

      <table>

        <tbody>
          ${d.ventasRecientes.map(r => {

  // ── Charts ──
